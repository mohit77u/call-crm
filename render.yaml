# Render blueprint — deploys the Call CRM API + Postgres.
# Usage: Render dashboard → New → Blueprint → point at this repo.
# After first deploy, set CORS_ORIGIN and APP_URL to your Vercel URL, then redeploy.

services:
  - type: web
    name: call-crm-api
    runtime: node
    plan: free
    rootDir: apps/web/backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render automatically — do not set it here.
      - key: DATABASE_URL
        fromDatabase:
          name: call-crm-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your Vercel frontend URL, e.g. https://call-crm.vercel.app
      - key: APP_URL
        sync: false # same Vercel URL — used in password reset emails
      - key: CRM_TIME_ZONE
        value: Asia/Kolkata
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Optional SMTP for password reset emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: call-crm-db
    plan: free
    databaseName: call_crm
    user: callcrm
